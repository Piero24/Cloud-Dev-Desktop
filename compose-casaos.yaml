name: cloud-dev-stack
services:
  # ================================================================
  # UBUNTU DESKTOP — Web UI + SSH
  # ================================================================
  desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: dev-desktop
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      CUSTOM_USER: CHANGE_ME_USERNAME
      PASSWORD: CHANGE_ME_WEB_PASSWORD
      SUDO_PASSWORD: CHANGE_ME_SUDO_PASSWORD
      CUSTOM_RES_W: "1920"
      CUSTOM_RES_H: "1080"
      # --- Claude Code ---
      # Leave empty to use Anthropic directly. Set to a third-party URL if needed.
      ANTHROPIC_BASE_URL: ""
      ANTHROPIC_AUTH_TOKEN: CHANGE_ME_ANTHROPIC_KEY
      ANTHROPIC_MODEL: claude-opus-4-8
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-8
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
      CLAUDE_CODE_SUBAGENT_MODEL: claude-haiku-4-5
      CLAUDE_CODE_EFFORT_LEVEL: max
      GIT_USER_NAME: CHANGE_ME_GIT_NAME
      GIT_USER_EMAIL: CHANGE_ME_GIT_EMAIL
      GITHUB_TOKEN: CHANGE_ME_GITHUB_TOKEN
    x-casaos:
      envs:
        - container: CUSTOM_USER
          description:
            en_us: System username inside the container (default abc). Used for SSH, file ownership, and desktop session.
        - container: PUID
          description:
            en_us: User ID for file permissions. Run 'id [USER]' on the host to get this.
        - container: PGID
          description:
            en_us: Group ID for file permissions.
        - container: TZ
          description:
            en_us: Timezone, e.g. Europe/Rome.
        - container: PASSWORD
          description:
            en_us: Login password for the KasmVNC web desktop. Also used for code-server.
        - container: SUDO_PASSWORD
          description:
            en_us: Sudo password inside the container. Also used for SSH login.
        - container: CUSTOM_RES_W
          description:
            en_us: Desktop width in pixels (default 1920). Lower values make text/icons larger.
        - container: CUSTOM_RES_H
          description:
            en_us: Desktop height in pixels (default 1080). Lower values make text/icons larger.
        - container: ANTHROPIC_AUTH_TOKEN
          description:
            en_us: "Anthropic API key for Claude Code. Get one at console.anthropic.com. Shared to VS Code via /shared."
        - container: GITHUB_TOKEN
          description:
            en_us: "GitHub fine-grained PAT (Settings → Developer settings → Personal access tokens). Shared to VS Code via /shared."
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 22
        published: 3434
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cloud-dev/config
        target: /config
      - type: bind
        source: /DATA/AppData/cloud-dev/projects
        target: /projects
      - type: bind
        source: /DATA/AppData/cloud-dev/init.d
        target: /etc/cont-init.d
        read_only: true
      - type: bind
        source: /DATA/AppData/cloud-dev/shared
        target: /shared
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    networks:
      - npm-network

  # ================================================================
  # VS CODE — Browser-based editor
  # ================================================================
  vscode:
    image: lscr.io/linuxserver/code-server:latest
    container_name: dev-vscode
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      PASSWORD: CHANGE_ME_WEB_PASSWORD
      DEFAULT_WORKSPACE: /projects
    x-casaos:
      envs:
        - container: PASSWORD
          description:
            en_us: Login password for code-server. Same as the KasmVNC desktop password.
        - container: DEFAULT_WORKSPACE
          description:
            en_us: Default folder to open on login. Keep as /projects to see shared files.
    ports:
      - target: 8443
        published: 9090
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/cloud-dev/config
        target: /config
      - type: bind
        source: /DATA/AppData/cloud-dev/projects
        target: /projects
      - type: bind
        source: /DATA/AppData/cloud-dev/shared
        target: /shared
      - type: bind
        source: /DATA/AppData/cloud-dev/init.d/99-vscode-env.sh
        target: /etc/cont-init.d/99-vscode-env.sh
        read_only: true
    networks:
      - npm-network

  # ================================================================
  # BESZEL AGENT — Sends system metrics to your Beszel hub
  # ================================================================
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: dev-beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: "45002"
      KEY: CHANGE_ME_BESZEL_KEY
      EXTRA_FILESYSTEMS: /dev/sda1
    x-casaos:
      envs:
        - container: LISTEN
          description:
            en_us: Port the agent listens on. Must match the port configured in your Beszel hub for this system.
        - container: KEY
          description:
            en_us: SSH public key from your Beszel hub (copy from the Add system dialog).
        - container: EXTRA_FILESYSTEMS
          description:
            en_us: Additional filesystems to monitor (e.g. /dev/sda1 for main disk).
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

networks:
  npm-network:
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: desktop
  developer: LinuxServer.io
  author: CloudDev
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webtop-logo.png
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/webtop-logo.png
  title:
    en_us: Cloud Dev Stack
  category: Development
  description:
    en_us: >
      Cloud Dev Stack — Ubuntu XFCE desktop (browser), VS Code (browser),
      and SSH access all sharing the same /projects folder.
      Includes nvm, Node LTS, Claude Code, and build tools pre-installed.
  tagline:
    en_us: >
      Ubuntu XFCE desktop + VS Code in your browser, plus SSH.
      All share the same /projects folder.
  port_map: "3000"
