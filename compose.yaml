name: cloud-dev-stack
services:
  # ================================================================
  # UBUNTU DESKTOP — Web UI + SSH
  # ================================================================
  desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: dev-desktop
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      CUSTOM_USER: CHANGE_ME_USERNAME
      PASSWORD: CHANGE_ME_WEB_PASSWORD
      SUDO_PASSWORD: CHANGE_ME_SUDO_PASSWORD
      CUSTOM_RES_W: "1920"
      CUSTOM_RES_H: "1080"
    ports:
      - "3000:3000"
      - "3434:22"
    volumes:
      - ./config:/config
      - ./projects:/projects
      - ./init.d:/etc/cont-init.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - npm-network

  # ================================================================
  # VS CODE — Browser-based editor
  # ================================================================
  vscode:
    image: lscr.io/linuxserver/code-server:latest
    container_name: dev-vscode
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      PASSWORD: CHANGE_ME_WEB_PASSWORD
      DEFAULT_WORKSPACE: /projects
    ports:
      - "9090:8443"
    volumes:
      - ./vscode-config:/config
      - ./projects:/projects
    networks:
      - npm-network

  # ================================================================
  # BESZEL AGENT — Sends system metrics to your Beszel hub
  # ================================================================
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: dev-beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: "45002"
      KEY: CHANGE_ME_BESZEL_KEY
      EXTRA_FILESYSTEMS: /dev/sda1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  npm-network:
    external: true
