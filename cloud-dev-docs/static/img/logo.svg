<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cloud body -->
  <g transform="translate(100, 112)">
    <ellipse cx="0" cy="0" rx="68" ry="42" fill="url(#cloudGrad)"/>
    <ellipse cx="-34" cy="-14" rx="43" ry="36" fill="url(#cloudGrad)"/>
    <ellipse cx="34" cy="-16" rx="46" ry="38" fill="url(#cloudGrad)"/>
    <ellipse cx="0" cy="-33" rx="40" ry="33" fill="url(#cloudGrad)"/>
  </g>

  <!-- Code brackets inside cloud -->
  <g transform="translate(100, 112)">
    <text x="0" y="9" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="38" font-weight="bold" fill="url(#codeGrad)">&lt;/&gt;</text>
  </g>
</svg>
